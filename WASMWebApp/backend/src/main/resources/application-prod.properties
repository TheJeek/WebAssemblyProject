# Spring Boot application properties
# author Jonas Lanz

spring.application.name=WASMApp
# General JPA/Hibernate configurations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Database connection
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://postgresdb:5432/wasmapp_db}
spring.datasource.username=${DATABASE_USERNAME:WASM}
spring.datasource.password=${DATABASE_PASSWORD:WASM}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.platform=postgresql

# Server configuration
server.port=${SERVER_PORT:8080}

# Static file location
spring.web.resources.static-locations=file:../frontend/dist/

# Default active profile
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Configure Multipart File for Servlet
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB