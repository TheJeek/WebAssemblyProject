# bwCloud cloud nginx reverse proxy config in file /etc/nginx/sites-available/default
server {
        server_name hsaalenwasmprojectjl.abrdns.com;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cross-Origin-Resource-Policy same-origin always;
        location /api/ {
                proxy_pass http://localhost:8080;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
                # Allow access
                allow all;
        }
        location / {
                proxy_pass http://localhost:3000;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_cache_bypass $http_upgrade;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/hsaalenwasmprojectjl.abrdns.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/hsaalenwasmprojectjl.abrdns.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = hsaalenwasmprojectjl.abrdns.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


        listen 80;
        server_name hsaalenwasmprojectjl.abrdns.com;
    return 404; # managed by Certbot


}